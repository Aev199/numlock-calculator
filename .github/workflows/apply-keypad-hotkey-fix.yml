name: apply-keypad-hotkey-fix

on:
  push:
    branches:
      - release/v1.1.0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.1.0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply keypad hotkey fix
        run: python tools/apply_keypad_hotkey_fix.py
      - name: Verify focused tests
        run: |
          python -m py_compile app_numlock_compat.py hotkey_config.py
          python -m unittest tests.test_hotkey -v
      - name: Commit product changes
        shell: bash
        run: |
          if git diff --quiet -- app_numlock_compat.py renderer/app-shell-v2.hotkey.js tests/test_hotkey.py CHANGELOG.md; then
            echo "No product changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_numlock_compat.py renderer/app-shell-v2.hotkey.js tests/test_hotkey.py CHANGELOG.md
          git commit -m "Distinguish navigation hotkeys from numpad aliases"
          git push origin HEAD:release/v1.1.0
