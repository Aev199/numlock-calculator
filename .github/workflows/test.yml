name: tests

on:
  push:
    branches:
      - redesign/keyboard-first
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile Python sources
        run: python -m py_compile app.py app_keyboard.py app_stability.py app_numlock_compat.py calc_engine.py calc_engine_runtime.py
      - name: Test calculation engine
        run: python -m unittest tests.test_calc_engine -v
      - name: Test application API
        run: python -m unittest tests.test_app -v
      - name: Test focus and NumLock stability
        run: python -m unittest tests.test_stability -v
      - name: Test full build sequence
        id: discover
        continue-on-error: true
        run: python -m unittest discover -s tests -v > discover.log 2>&1
      - name: Upload full build test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discover-log
          path: discover.log
      - name: Report full build test failure
        if: steps.discover.outcome == 'failure'
        run: |
          cat discover.log
          exit 1
      - name: Check renderer JavaScript
        run: |
          node --check renderer/script.js
          node --check renderer/script-v2.js
