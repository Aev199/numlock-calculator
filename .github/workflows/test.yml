name: tests

on:
  push:
    branches:
      - redesign/keyboard-first
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile Python sources
        run: python -m py_compile app.py app_keyboard.py calc_engine.py calc_engine_runtime.py
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Check renderer JavaScript
        run: node --check renderer/script.js
