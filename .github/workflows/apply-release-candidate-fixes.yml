name: apply-release-candidate-fixes

on:
  workflow_dispatch:
  push:
    branches:
      - release/v1.1.0

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.1.0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Pillow for icon verification
        run: python -m pip install Pillow==11.3.0
      - name: Apply deterministic fixes
        run: python tools/apply_release_candidate_fixes.py
      - name: Verify Python syntax
        run: python -m py_compile app_icon.py number_formatting.py calc_engine.py app.py app_tray.py
      - name: Commit generated release fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix release icon and decimal-place formatting"
          git push origin HEAD:release/v1.1.0
