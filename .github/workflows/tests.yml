name: tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile Python sources
        run: >-
          python -m py_compile
          app.py app_keyboard.py app_window.py app_numlock_compat.py
          app_tray.py app_units_backend.py app_variables.py app_renderer.py
          app_diagnostics.py app_product.py app_single_instance.py app_storage.py
          calculation_limits.py generate_version_info.py input_normalization.py
          product_info.py unit_conversion.py calc_engine.py calc_engine_runtime.py
      - name: Verify generated product metadata
        run: |
          python generate_version_info.py
          git diff --exit-code -- version_info.txt
      - name: Test calculation engine
        run: python -m unittest tests.test_calc_engine -v
      - name: Test application API
        run: python -m unittest tests.test_app -v
      - name: Test focus and NumLock stability
        run: python -m unittest tests.test_stability -v
      - name: Test consolidated renderer
        run: python -m unittest tests.test_renderer -v
      - name: Test frameless tray shell
        run: python -m unittest tests.test_tray -v
      - name: Test separate units mode
        run: python -m unittest tests.test_units_mode -v
      - name: Test full build sequence
        id: discover
        continue-on-error: true
        run: python -m unittest discover -s tests -v > discover.log 2>&1
      - name: Upload full build test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discover-log-linux
          path: discover.log
      - name: Report full build test failure
        if: steps.discover.outcome == 'failure'
        run: |
          cat discover.log
          exit 1
      - name: Check consolidated renderer JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import app_renderer

          renderer = Path('renderer')
          source = '\n'.join(
              (renderer / name).read_text(encoding='utf-8')
              for name in app_renderer.SCRIPT_PARTS
          )
          Path('renderer-check.js').write_text(source, encoding='utf-8')
          assert 'keydown-v2' not in source
          assert 'interceptTextInsertion' not in source
          assert 'interceptPhysicalKey' not in source
          assert 'beginCaretGlyphMotion' not in source
          assert 'nlcalc-caret-glyph' not in source
          assert "const DISPLAY_MULTIPLY = '⋅';" in source
          assert "event.code === 'KeyC'" in source
          assert 'reportRendererDiagnostic' in source
          assert 'delete_variable' in source
          PY
          node --check renderer-check.js

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run full Windows test suite
        run: python -m unittest discover -s tests -v
      - name: Generate Windows version metadata
        run: python generate_version_info.py
      - name: Build NumCalc one-file executable
        run: python -m PyInstaller --noconfirm --clean NumLockCalc.spec
      - name: Verify executable metadata and write SHA-256
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'dist\NumCalc.exe')) {
            throw 'dist\NumCalc.exe was not created'
          }
          $file = Get-Item -LiteralPath 'dist\NumCalc.exe'
          if ($file.Length -le 0) {
            throw 'dist\NumCalc.exe is empty'
          }
          $info = $file.VersionInfo
          if ($info.ProductName -ne 'NumCalc') {
            throw "Unexpected ProductName: $($info.ProductName)"
          }
          if ($info.FileVersion -ne '1.0.0') {
            throw "Unexpected FileVersion: $($info.FileVersion)"
          }
          if ($info.ProductVersion -ne '1.0.0') {
            throw "Unexpected ProductVersion: $($info.ProductVersion)"
          }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLower()
          Set-Content -Encoding ascii -LiteralPath 'dist\NumCalc.exe.sha256.txt' -Value ($hash + '  NumCalc.exe')
      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: NumCalc-windows-release
          path: |
            dist/NumCalc.exe
            dist/NumCalc.exe.sha256.txt
          if-no-files-found: error
