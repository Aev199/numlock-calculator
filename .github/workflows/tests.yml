name: tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile Python sources
        run: >-
          python -m py_compile
          app.py app_keyboard.py app_window.py app_native_titlebar.py app_numlock_compat.py
          app_tray.py app_native_dialogs.py app_units_backend.py app_variables.py
          app_renderer.py app_diagnostics.py app_product.py app_single_instance.py
          app_storage.py app_formulas.py app_icon.py calculation_limits.py
          collect_third_party_licenses.py generate_version_info.py
          hotkey_config.py input_normalization.py interpolation.py
          number_formatting.py product_info.py unit_conversion.py flexible_units.py
          calc_engine.py calc_engine_runtime.py update_core.py app_updates.py app_window_background.py history_rules.py
          tools/audit_public_history.py tools/verify_windows_manifest.py tools/release_manifest.py
      - name: Verify generated product metadata
        run: |
          python generate_version_info.py
          git diff --exit-code -- version_info.txt
      - name: Verify public repository files
        run: |
          test -f LICENSE
          test -f LICENSING.md
          test -f THIRD_PARTY_NOTICES.md
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f RELEASE_NOTES.md
          test -f docs/WINDOWS_ACCEPTANCE.md
          test -f docs/RELEASE_CHECKLIST.md
          test -f NumCalc.spec
          test -f NumCalc-folder.spec
          test -f NumCalc.manifest
          test ! -e NumLockCalc.spec
          test ! -e NumLockCalc-folder.spec
      - name: Audit reachable Git history before publication
        run: python tools/audit_public_history.py
      - name: Run full test suite
        run: python -m unittest discover -s tests -v
      - name: Check consolidated renderer JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import app_renderer

          renderer = Path('renderer')
          source = '\n'.join(
              (renderer / name).read_text(encoding='utf-8')
              for name in app_renderer.SCRIPT_PARTS
          )
          Path('renderer-check.js').write_text(source, encoding='utf-8')
          assert 'keydown-v2' not in source
          assert 'interceptTextInsertion' not in source
          assert 'interceptPhysicalKey' not in source
          assert 'beginCaretGlyphMotion' not in source
          assert 'nlcalc-caret-glyph' not in source
          assert "const DISPLAY_MULTIPLY = '⋅';" in source
          assert "event.code === 'KeyC'" in source
          assert 'reportRendererDiagnostic' in source
          assert 'delete_variable' in source
          assert 'MODE_MOTION_ORDER' in source
          assert 'DIGIT_GROUP_SEPARATOR' in source
          assert 'renderFlexibleUnitPickers' in source
          assert 'composePickerSymbol' in source
          PY
          node --check renderer-check.js
