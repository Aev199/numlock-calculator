<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NumLock Calc</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">
  <div class="app-container">
    <!-- Шапка -->
    <div class="header">
      <span class="app-title">NumLock Calc</span>
      <div class="header-actions">
        <button class="icon-btn" id="btnTheme" title="Тёмная/светлая тема">🌓</button>
      </div>
    </div>

    <!-- Вкладки: Калькулятор и Конвертер -->
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="calc">Калькулятор</button>
      <button class="tab-btn" data-tab="converter">Конвертер</button>
    </div>

    <!-- Калькулятор -->
    <div class="tab-content active" id="tab-calc">
      <!-- История вычислений над дисплеем -->
      <div class="history-panel" id="historyPanel">
        <div class="history-scroll" id="historyScroll">
          <div class="history-empty">Нет истории</div>
        </div>
      </div>
      <!-- Дисплей -->
      <div class="display-area">
        <div class="expression-line" id="exprLine"></div>
        <div class="result-line" id="resultLine">0</div>
      </div>
      <!-- Клавиатура -->
      <div class="keypad" id="keypad">
        <!-- Генерируется JS -->
      </div>
      <!-- Переключение режима и очистка истории -->
      <div class="mode-bar">
        <button class="btn btn--memory" id="btnMode">Инженерный ▸ Стандартный</button>
        <button class="btn btn--memory" id="btnClearHistory" title="Очистить историю">🗑️</button>
      </div>
    </div>

    <!-- Конвертер -->
    <div class="tab-content" id="tab-converter">
      <div class="converter-wrap" id="converterWrap">
        <!-- Генерируется JS -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
